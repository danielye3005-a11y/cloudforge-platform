apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudforge-loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: CloudForge Loki
        uid: cloudforge-loki
        type: loki
        access: proxy
        url: http://loki.logging.svc.cluster.local:3100
        editable: true
