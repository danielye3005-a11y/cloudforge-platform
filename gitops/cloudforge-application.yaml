apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudforge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/danielye3005-a11y/cloudforge-platform.git
    targetRevision: main
    path: helm/cloudforge
    helm:
      releaseName: cloudforge
  destination:
    server: https://kubernetes.default.svc
    namespace: default
