apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudforge-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloudforge-api

  template:
    metadata:
      labels:
        app: cloudforge-api

    spec:
      containers:
        - name: cloudforge-api
          image: cloudforge-api:v0.3
          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
