apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Release.Name }}-api

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api

    spec:
      containers:
        - name: cloudforge-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            - name: DB_HOST
              value: postgres.cloudforge-db.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: cloudforge
            - name: DB_USER
              value: cloudforge
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudforge-db-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
